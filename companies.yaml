# Companies configuration for OffCampus Matcher
# ATS types supported: greenhouse | lever | ashby
# slug: the part after the board URL

companies:
  - name: GitLab
    ats: greenhouse
    slug: gitlab
    domains: ["gitlab.com", "greenhouse.io"]

  - name: Figma
    ats: greenhouse
    slug: figma
    domains: ["figma.com", "greenhouse.io"]

  - name: Stripe
    ats: greenhouse
    slug: stripe
    domains: ["stripe.com", "greenhouse.io"]

  - name: Spotify
    ats: lever
    slug: spotify
    eu: false
    domains: ["spotify.com", "lever.co"]

  - name: Ashby HQ
    ats: ashby
    slug: ashby
    domains: ["ashbyhq.com"]
